name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Render health endpoint
        run: |
          curl -fsS --retry 5 --retry-delay 15 --connect-timeout 30 --max-time 180 \
            "https://ticket-management-system-th5i.onrender.com/api/health"
